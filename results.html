<!--
This code below partly generated by AI since I don't have a lot of 
experience with the HTML and JavaScript for live graphing.  However,
after the initial generation I modified it by hand.
It uses Chart.js to render a line graph of the distance readings over time. 
-->
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ESP32 Live Sensor Graph</title>
    <!--<script src="https://jsdelivr.net"></script>-->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 15px; }
        .header { display: flex; justify-content: space-between; align-items: center; }
        canvas { width: 100%; max-height: 400px; }
    </style>
</head>
<body>
    <div class="header">
        <h2>Distance (mm)</h2>
        <span id="latest">-- mm</span>
    </div>
    <canvas id="chart"></canvas>
    <div class="header">
        <h2>Reliability</h2>
    </div>
    <canvas id="reliabilityChart"></canvas>

    <script>
        const ctx = document.getElementById('chart').getContext('2d');
        const chart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Distance (mm)',
                    data: [],
                    borderColor: '#0284c7',
                    tension: 0.2,
                    fill: false
                }]
            },
            options: {
                animation: false, // Prevents jitter on live updates
                scales: { y: { beginAtZero: true } }
            }
        });

        const reliabilityCtx = document.getElementById('reliabilityChart').getContext('2d');
        const reliabilityChart = new Chart(reliabilityCtx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Reliability',
                    data: [],
                    borderColor: '#10b981',
                    tension: 0.2,
                    fill: false
                }]
            },
            options: {
                animation: false, // Prevents jitter on live updates
                scales: { y: { beginAtZero: true, max: 1 } }
            }
        });

        async function updateGraph() {
            try {
                const res = await fetch('/data');
                const points = await res.json();

                chart.data.labels = points.map(p => p.t);
                chart.data.datasets[0].data = points.map(p => p.v);
                chart.update();

                reliabilityChart.data.labels = points.map(p => p.t);
                reliabilityChart.data.datasets[0].data = points.map(p => p.r);
                reliabilityChart.update();

                lastReading = points.findIndex(p => p.v == 0);

                if (lastReading > 0) {
                    const last = points[lastReading];
                    document.getElementById('latest').textContent = `${last.v} mm`;
                }
            } catch (e) {
                console.error('Fetch failed:', e);
            }
        }

        async function updateLast() {
            try {
                const res = await fetch('/last');
                const last = await res.json();

                lastReading = chart.data.datasets[0].data.findIndex(p => p == 0);

                if (lastReading == -1) {
                    chart.data.labels.shift();
                    chart.data.datasets[0].data.shift();
                    chart.data.labels.push(last.t);
                    chart.data.datasets[0].data.push(last.v);

                    reliabilityChart.data.labels.shift();
                    reliabilityChart.data.datasets[0].data.shift();
                    reliabilityChart.data.labels.push(last.t);
                    reliabilityChart.data.datasets[0].data.push(last.r);
                }
                else {
                    chart.data.labels[lastReading] = last.t;
                    chart.data.datasets[0].data[lastReading] = last.v;
                    reliabilityChart.data.labels[lastReading] = last.t;
                    reliabilityChart.data.datasets[0].data[lastReading] = last.r;
                }
                document.getElementById('latest').textContent = `${last.v} mm`;
                chart.update();
                reliabilityChart.update();
            } catch (e) {
                console.error('Fetch failed:', e);
            }
        }

        updateGraph();
        setInterval(updateLast, 1000);
    </script>
</body>
</html>
