[package]
name = "esp32-rust-test"
version = "0.1.0"
authors = ["achal"]
edition = "2021"
resolver = "2"
rust-version = "1.82"

[[bin]]
name = "esp32-rust-test"
harness = false # do not use the built-in cargo test harness -> resolve rust-analyzer errors

[profile.release]
opt-level = "s"

[profile.dev]
debug = true    # Symbols are nice, and they don't increase the size on Flash
opt-level = "s"
lto = true      # Link Time Optimization (LTO) is a must for embedded targets

[dependencies]
log = "0.4"
esp-idf-svc = { version = "0.52.1", features = ["critical-section", "embassy-time-driver", "embassy-sync"] }
esp-idf-sys = { version = "0.37.2", features = ["binstart"] }
# Remove `generic-queue-8` if you plan to use `embassy-time` WITH `embassy-executor`
embassy-time = { version = "0.5", features = ["generic-queue-8"] }
esp-idf-hal = "0.46.2"
anyhow = "1.0.104"
vl53l1x-uld = "2.0"
embedded-svc = "0.29.0"

[build-dependencies]
embuild = "0.33"
